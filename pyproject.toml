[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pizza-chart-app"
version = "1.0.0"
description = "A machine learning application for generating predictive football statistics and visualizing them in pizza charts"
authors = [
    {name = "Pizza Chart Team", email = "team@pizzachart.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "dash>=3.0.0",
    "plotly>=6.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "pyarrow>=12.0.0",
    "fastparquet>=2024.0.0",
    "nfl-data-py>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
pizza-chart-app = "pizza_chart_app.app:main"

[project.urls]
Homepage = "https://github.com/yourusername/pizza-chart-comp-app"
Repository = "https://github.com/yourusername/pizza-chart-comp-app"
Issues = "https://github.com/yourusername/pizza-chart-comp-app/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
